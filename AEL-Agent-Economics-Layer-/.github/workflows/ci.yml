name: AEL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --strict)
        run: npm run lint

      - name: Run Vitest unit & engine tests
        run: npm test

      - name: Run Tool-DC Evaluation Suite
        run: npx tsx bin/ael.ts eval --suite tool

      - name: Run AERA/CoBa Budget Evaluation Suite (Held-Out Split)
        run: npx tsx bin/ael.ts eval --suite budget --split held_out

      - name: Build frontend distribution
        run: npm run build
